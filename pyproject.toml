[features]
instruments = true
extensions = false  # true if plugins contains dashboard extensions
models = false  # true if plugins contains pid models
h5exporters = false  # true if plugin contains custom h5 file exporters
scanners = false  # true if plugin contains custom scan layout (daq_scan extensions)

[urls]
package-url = 'https://github.com:bernhardlang/pymodaq_plugins_tutorial_extension'

[project]
name = "pymodaq_plugins_tutorial_extension"
description = 'code for PyMoDAQ extension tutorial'
dependencies = [
    "pymodaq>=5.2.0",
    "pymodaq_utils>=5.2.0",
    "pymodaq_gui>=5.2.0",
    "pymodaq_data>=5.2.0",
    #todo: list here all dependencies your package may have
]

authors = [
    {name = "Bernhard Lang", email = "bernhard.lang@unige.ch"},
    #todo: list here all authors of your plugin
]
maintainers = [
    {name = "Bernhard Lang", email = "bernhard.lang@unige.ch"},
    #todo: list here all maintainers of your plugin
]

# nottodo: leave everything below as is!

dynamic = ["version", "urls", "entry-points"]
readme = "README.rst"
license = { file="LICENSE" }
requires-python = ">=3.8"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

[build-system]
requires = [
    "hatchling>=1.9.0",
    "hatch-vcs", "toml",
    "pymodaq_utils>=0.0.6",
]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.version]
source = "vcs"

